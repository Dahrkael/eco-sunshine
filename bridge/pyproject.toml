[project]
name = "deebot930-bridge"
version = "0.2.0"
description = "Bridge XMPP+MQTT -> MQTT para robots Ecovacs: decoder de mapa en vivo + integracion Home Assistant"
requires-python = ">=3.10"

dependencies = [
    "aiomqtt>=2.0",
    "aiohttp>=3.9",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
deebot930-bridge = "deebot930_bridge.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

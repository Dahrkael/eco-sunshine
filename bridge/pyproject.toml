[project]
name = "eco-sunshine"
version = "0.2.0"
description = "XMPP+MQTT -> MQTT bridge for Ecovacs robots: live map decoder + Home Assistant integration"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

dependencies = [
    "aiomqtt>=2.0",
    "aiohttp>=3.9",
    "zstandard>=0.22",
    # TOML parsing on python <3.11 (tomllib is stdlib since 3.11)
    "tomli>=2.0; python_version < '3.11'",
    # embedded MQTT broker (FC): maintained fork of hbmqtt, py3.12+
    "amqtt>=0.12",
    # auto-generation of the embedded servers' certs (FE) — also used
    # by the broker's TLS tests
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
eco-sunshine = "eco_sunshine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eco_sunshine", "eco_sunshine.servers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "ecovacs-bridge"
version = "0.2.0"
description = "Bridge XMPP+MQTT -> MQTT para robots Ecovacs: decoder de mapa en vivo + integracion Home Assistant"
requires-python = ">=3.10"

dependencies = [
    "aiomqtt>=2.0",
    "aiohttp>=3.9",
    "zstandard>=0.22",
    # broker MQTT embebido (FC): fork mantenido de hbmqtt, py3.12+
    "amqtt>=0.12",
    # auto-generación de certs de los servidores embebidos (FE) — también
    # la usan los tests TLS del broker
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ecovacs-bridge = "ecovacs_bridge.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

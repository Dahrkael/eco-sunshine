# Bridge config for docker-compose (mounted at /config/bridge.toml)
panel_port = 8181
state_file = "/data/state.json"   # persistent pieces+positions (volume ./data/bridge)

# ── Embedded servers (Bumper absorption, docs/bumper-absorption.md) ──
# Each component turns on separately; with all of them off the bridge is
# a pure client against an external Bumper. In production
# (configs/bridge.toml) lookup+xmpp+mqtt are on: the bridge IS the server.
[servers]
lookup = false             # :8007  robot bootstrap (lookup.do) — FA
xmpp = false               # :5223  XMPP server, 930-era robots — FB
mqtt = false               # :8883  eco-ng broker — FC
conf = false               # :443   legacy Ecovacs app API (FD): login,
                           #        getAuthCode and bot list from the registry.
                           #        Enable only to use the app as a
                           #        client/oracle (the modern one is HMAC-signed
                           #        and not supported)
panel = true               # bridge web panel
announce_ip = ""           # IP announced to robots (required if lookup=on;
                           # empty → the deploy's DEEBOT_ANNOUNCE_IP env is used)
# lookup_port = 8007
# xmpp_port = 5223
# mqtt_port = 8883
# conf_port = 443
# TLS for xmpp/mqtt: if the material is missing it is auto-generated on
# first boot (FE)
# ca_file = "/certs/ca.crt"
# server_cert = "/certs/bumper.crt"
# server_key = "/certs/bumper.key"
[bumper]
host = "bumper"          # compose service name
port = 5223
uid = "fuid_tmpuser"
resource = "bridge"
ca_file = "/certs/ca.crt"

[mqtt]
host = "mosquitto"
port = 1883
base_topic = "deebot"

[bumper_mqtt]
host = "bumper"
port = 8883
ca_file = "/certs/ca.crt"
enabled = true
# known eco-ng robots (did@class/res) — adopted at startup without
# waiting for their first report (sleeping robots emit nothing)
robots = []

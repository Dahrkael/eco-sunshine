# Bridge production config (docker-compose container)
panel_port = 8181
state_file = "/data/state.json"   # persistent pieces+positions

# known robots (adopted at startup + initial poll)
robots = ["E000105701860607AB7@115.ecorobot.net/atom"]

# ── Embedded servers (Bumper absorption, docs/bumper-absorption.md) ──
# lookup+XMPP+MQTT broker inside the bridge process: no external Bumper.
# conf (:443, the Ecovacs app API) is implemented (FD) but stays OFF:
# enable it only to pair with the legacy app or use it as an oracle
# (remember to publish 443 in docker-compose.yml).
[servers]
lookup = true              # :8007  robot bootstrap (lookup.do)
xmpp = true                # :5223  XMPP server (930-era robots)
mqtt = true                # :8883  TLS MQTT broker (eco-ng T8+)
# conf = true              # :443   Ecovacs app API (FD, off by default)
# announce_ip: injected by compose via DEEBOT_ANNOUNCE_IP (= the .env's
# BUMPER_ANNOUNCE_IP). Uncomment to pin it here (the toml wins over env):
# announce_ip = "192.0.2.10"
# certs: Bumper's legacy names — in production they already exist in
# ./data/certs and are NOT regenerated; if missing (clean install) they
# are auto-generated (FE)
ca_file = "/certs/ca.crt"
server_cert = "/certs/bumper.crt"
server_key = "/certs/bumper.key"

# Bridge's XMPP client — with the embedded XMPP on, serve points it at
# 127.0.0.1 (automatic rewrite); explicit for clarity
[bumper]
host = "127.0.0.1"
port = 5223
uid = "fuid_tmpuser"
resource = "bridge"
ca_file = "/certs/ca.crt"

[mqtt]
host = "mosquitto"
port = 1883
base_topic = "deebot"

# eco-ng client (T8+) — against the embedded broker, just like XMPP
[bumper_mqtt]
host = "127.0.0.1"
port = 8883
ca_file = "/certs/ca.crt"
enabled = true

name: ecovacs

services:
  # ── Bridge: the whole flow in a single container (Bumper absorption, FE) ──
  # lookup :8007 (robot bootstrap) + XMPP :5223 (930-era robots) + TLS MQTT
  # broker :8883 (eco-ng T8+) embedded in the process, plus the panel :8181.
  # Port 443 (Ecovacs app conf API) is implemented (FD) but off by default:
  # publish the port only if you enable servers.conf (below).
  bridge:
    build: ./bridge
    container_name: ecovacs-bridge
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # bridge's servers.announce_ip (the toml does not read the
      # environment): same IP Bumper used to consume — announced to
      # robots/app in lookup.do
      DEEBOT_LOG_LEVEL: ${DEEBOT_LOG_LEVEL:-INFO}
      DEEBOT_ANNOUNCE_IP: ${BUMPER_ANNOUNCE_IP:?define it in .env — the IP announced to the robots}
    ports:
      - "5223:5223"     # embedded XMPP   <- OZMO 930
      - "8007:8007"     # lookup.do (robot bootstrap)
      - "8883:8883"     # embedded MQTT broker (eco-ng T8+)
      - "8181:8181"     # bridge web panel
      # Ecovacs app API (FD): uncomment ONLY if you enable
      # servers.conf = true in configs/bridge.toml (the legacy app will be
      # able to log in/list/connect against the bridge, no Bumper legacy).
      # ⚠️ Conflicts with bumper legacy, which also publishes 443.
      # - "443:443"
    volumes:
      - ./data/certs:/certs          # RW: auto-generated on first boot if missing (FE)
      - ./configs/bridge.toml:/config/bridge.toml:ro
      - ./data/bridge:/data          # persistent state_file + registry
    command: ["serve", "-c", "/config/bridge.toml", "--mqtt"]

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ecovacs-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto:/mosquitto/config:ro

  # ── Bumper LEGACY (transition) ──
  # Replaced by the bridge's embedded servers (FA-FC, see
  # docs/bumper-absorption.md). Kept under the `legacy` profile for
  # rollback or comparison during the transition:
  #
  #   docker compose --profile legacy up -d bumper
  #
  # ⚠️ Do NOT run it alongside the bridge: they publish the same ports
  # (5223/8883/8007) and would fight over the robot. If you start it, stop
  # the bridge first (and remember: with [servers] off the bridge is a pure
  # client of this Bumper, as before the merge).
  bumper:
    build: ./bumper          # vendored source (instrumentable in phase 2)
    container_name: ecovacs-bumper
    restart: unless-stopped
    profiles: ["legacy"]
    environment:
      TZ: ${TZ:-Europe/Madrid}
      BUMPER_ANNOUNCE_IP: ${BUMPER_ANNOUNCE_IP}   # IP announced to robot/app (Windows host in dev)
      BUMPER_LISTEN: 0.0.0.0
      BUMPER_DATA: /bumper/data
      BUMPER_CERTS: /bumper/certs
      BUMPER_DEBUG: ${BUMPER_DEBUG:-true}
      LOG_TO_STDOUT: "true"
    ports:
      - "443:443"     # confserver (auth / API)
      - "5223:5223"   # XMPP  <- OZMO 930
      - "8007:8007"   # confserver (lbo lookup: the robot asks here for the XMPP IP)
      - "8883:8883"   # MQTT  (in case the firmware spoke MQTT)
    volumes:
      - ./data/bumper:/bumper/data
      - ./data/certs:/bumper/certs

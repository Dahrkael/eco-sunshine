# Pi-hole / dnsmasq: redirect the WHOLE Ecovacs domain ecosystem to the
# host running the bridge (here 192.0.2.10 — use your host's IP).
# The address=/domain/ syntax is a wildcard: it covers lb-*, msg-*, mq-*,
# portal-*, gl-*, api-app.*, etc. without enumerating subdomains.
#
# !! Pi-hole v6 does NOT read /etc/dnsmasq.d by default !!
# Two ways to apply it on v6:
#   A) Settings -> All settings (expert) -> Miscellaneous -> dnsmasq_lines:
#      paste the 3 "address=..." lines there (it persists in pihole.toml).
#   B) Settings -> All settings -> Miscellaneous -> etc_dnsmasq_d = true
#      and mount this file as a volume in the container's /etc/dnsmasq.d.
#
# Install (Pi-hole in docker): mount this file at /etc/dnsmasq.d/
# Install (bare-metal Pi-hole): copy to /etc/dnsmasq.d/99-deebot-bumper.conf
# Apply:  docker compose restart pihole   (or: pihole reloaddns)

address=/ecouser.net/192.0.2.10
address=/ecovacs.com/192.0.2.10
address=/ecovacs.net/192.0.2.10

# Pi-hole / dnsmasq: redirigir TODO el ecosistema de dominios de Ecovacs
# al host que ejecuta Bumper (192.0.2.10 en DEV; IP del minipc en PROD).
# La sintaxis address=/dominio/ es wildcard: cubre lb-*, msg-*, mq-*,
# portal-*, gl-*, api-app.*, etc. sin enumerar subdominios.
#
# !! Pi-hole v6 NO lee /etc/dnsmasq.d por defecto !!
# Dos formas de aplicarlo en v6:
#   A) Settings -> All settings (expert) -> Miscellaneous -> dnsmasq_lines:
#      pegar las 3 lineas "address=..." ahi (persiste en pihole.toml).
#   B) Settings -> All settings -> Miscellaneous -> etc_dnsmasq_d = true
#      y montar este fichero como volumen en /etc/dnsmasq.d del contenedor.
#
# Instalacion (Pi-hole en docker): montar este fichero en /etc/dnsmasq.d/
# Instalacion (Pi-hole bare-metal): copiar a /etc/dnsmasq.d/99-deebot-bumper.conf
# Aplicar:  docker compose restart pihole   (o: pihole reloaddns)

address=/ecouser.net/192.0.2.10
address=/ecovacs.com/192.0.2.10
address=/ecovacs.net/192.0.2.10
